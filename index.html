<!DOCTYPE html>
<html>
<head>
<title>Khan's Prince</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family: Arial;
    background:#0b0b0b;
    color:white;
}

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    padding:20px 40px;
    background:black;
    position:sticky;
    top:0;
}

nav a {
    color:white;
    margin-left:20px;
    text-decoration:none;
    transition:0.3s;
}

nav a:hover {
    color:gold;
}

/* HERO */
.hero {
    text-align:center;
    padding:80px 20px;
    animation:fadeIn 2s;
}

.hero h1 {
    font-size:40px;
}

.hero p {
    margin:15px 0;
}

button {
    padding:12px 25px;
    background:gold;
    border:none;
    color:black;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    background:white;
}

/* PRODUCTS */
.products {
    padding:50px;
    text-align:center;
}

.product {
    display:inline-block;
    width:280px;
    margin:20px;
    background:#1a1a1a;
    border-radius:10px;
    overflow:hidden;
    transition:0.4s;
}

.product:hover {
    transform:scale(1.05);
}

.product img {
    width:100%;
}

.product h3 {
    margin:10px 0;
}

.product p {
    color:gold;
}

/* FOOTER */
footer {
    text-align:center;
    padding:20px;
    background:black;
    margin-top:40px;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

/* MOBILE */
@media (max-width:768px) {
    header {
        flex-direction:column;
        text-align:center;
    }

    nav {
        margin-top:10px;
    }

    .product {
        width:90%;
    }
}
</style>
</head>

<body>

<header>
<h2>Khan's Prince</h2>
<nav>
<a href="#">Home</a>
<a href="#">Shirts</a>
<a href="#">Pants</a>
<a href="#">Contact</a>
</nav>
</header>

<div class="hero">
<h1>Premium Style Collection</h1>
<p>Luxury shirts and pants for modern men</p>
<button>Shop Now</button>
</div>

<div class="products">

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Black Shirt</h3>
<p>₹1999</p>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>White Shirt</h3>
<p>₹1899</p>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Premium Pant</h3>
<p>₹2499</p>
</div>

</div>

<footer>
<p>© Khan's Prince | Premium Collection</p>
</footer>

</body>
</html>
